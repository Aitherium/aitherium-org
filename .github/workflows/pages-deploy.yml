# Aitherium Foundation site → GitHub Pages at aitherium.org
#
# Static site, no build step: checkout → upload → deploy.
# The site is deliberately plain HTML/CSS/JS so Pages deploys are trivially
# reproducible from any machine.
#
# Runner: self-hosted Linux per the org's standing rule (SHW004 — GitHub-hosted
# runners are billing-dead on this org; a job pinned to ubuntu-latest is
# created, never picked up, and fails with zero steps).
name: Deploy aitherium.org

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
