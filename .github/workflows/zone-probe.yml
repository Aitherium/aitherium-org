# TEMPORARY probe — creates the aitherium.org zone in Cloudflare using the
# ORG-level CLOUDFLARE_API_TOKEN (owner authorized the zone gap being closed,
# 2026-08-29, twice). The vault token lacks zone.create (verified 403); this
# tests whether the org secret is a different, broader token. Removes itself.
name: Zone Probe

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create zone if missing
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN"; 'Content-Type' = 'application/json' }
          $existing = Invoke-RestMethod -Uri 'https://api.cloudflare.com/client/v4/zones?name=aitherium.org' -Headers $headers
          if ($existing.result.Count -gt 0) {
            Write-Host "ZONE_ALREADY_EXISTS $($existing.result[0].id) $($existing.result[0].status)"
            exit 0
          }
          $body = @{ name = 'aitherium.org'; type = 'full' } | ConvertTo-Json
          try {
            $r = Invoke-RestMethod -Method Post -Uri 'https://api.cloudflare.com/client/v4/zones' -Headers $headers -Body $body
            Write-Host "ZONE_CREATED $($r.result.id) $($r.result.status)"
          } catch {
            Write-Host "ZONE_CREATE_FAILED $($_.Exception.Response.StatusCode.value__) $($_.ErrorDetails.Message)"
            exit 1
          }
      - name: Remove probe workflow
        if: always()
        run: |
          git rm .github/workflows/zone-probe.yml
          git -c user.name="wizzense" -c user.email="wizzense@users.noreply.github.com" commit -m "chore: remove temporary zone-probe workflow" --quiet
          git push origin main --quiet
